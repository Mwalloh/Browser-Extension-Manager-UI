<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link
			rel="icon"
			type="image/svg+xml"
			href="src/assets/images/favicon-32x32.png"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>browser-extension-manager-ui</title>

		<style>
			@import url("https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Unlock&display=swap");
		</style>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx">
			// Read saved theme, default to 'light' if null
			const theme = localStorage.getItem('theme') || 'light'
			document.documentElement.setAttribute('data-theme', theme)
		</script>
	</body>
</html>
